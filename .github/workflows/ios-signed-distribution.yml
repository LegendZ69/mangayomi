name: Signed iOS distribution

# Manual preparation only. No PR/push job receives signing credentials.
# GitHub exposes dispatch after this file reaches the default branch.
on:
  workflow_dispatch:
    inputs:
      route:
        description: Distribution route
        type: choice
        options: [adhoc, testflight]
        required: true
      source_sha:
        description: Reviewed full commit SHA of the selected workflow branch
        type: string
        required: true
      bundle_id:
        description: Explicit App ID owned by your Apple Developer team
        type: string
        required: true
      team_id:
        description: Ten-character Apple Developer Team ID
        type: string
        required: true
      build_name:
        description: Marketing version, for example 0.1.0
        type: string
        required: true
      build_number:
        description: Unused Apple build version, for example 1 or 1.0.1
        type: string
        required: true
      upload_testflight:
        description: Explicitly validate and upload the TestFlight IPA to Apple
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: ios-signed-${{ inputs.route }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  distribute:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26
    timeout-minutes: 75
    environment: ios-${{ inputs.route }}
    env:
      CI: 'true'
      COCOAPODS_DISABLE_STATS: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      # Official runner inventory, checked 2026-09-07. Fail if removed/changed.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IOS_ROUTE: ${{ inputs.route }}
      IOS_SOURCE_SHA: ${{ inputs.source_sha }}
      IOS_BUNDLE_ID: ${{ inputs.bundle_id }}
      IOS_TEAM_ID: ${{ inputs.team_id }}
      IOS_BUILD_NAME: ${{ inputs.build_name }}
      IOS_BUILD_NUMBER: ${{ inputs.build_number }}
      IOS_UPLOAD_TESTFLIGHT: ${{ inputs.upload_testflight }}
    steps:
      - name: Checkout selected workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The supplied SHA must match this exact workflow revision.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate inputs and supported Apple toolchain
        run: python3 .github/scripts/ios_signing.py preflight

      - name: Check distribution guards
        run: python3 -m unittest discover -s test/ci -p 'test_*.py' -v

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install locked dependencies
        timeout-minutes: 15
        run: flutter pub get --enforce-lockfile

      - name: Set up Rust for iPhone arm64
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - name: Archive, export and verify signed IPA
        id: signed
        timeout-minutes: 45
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: python3 .github/scripts/ios_signing.py build

      - name: Upload signed IPA as a GitHub artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mangayomi-ios-${{ inputs.route }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/signed-distribution/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # This is a separate external action and never follows an automatic build.
      - name: Validate and upload to App Store Connect
        id: upload
        if: ${{ inputs.route == 'testflight' && inputs.upload_testflight && steps.signed.outcome == 'success' }}
        timeout-minutes: 15
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: python3 .github/scripts/ios_signing.py upload

      - name: Remove signing material and intermediate archives
        if: ${{ always() }}
        run: python3 .github/scripts/ios_signing.py cleanup

      - name: Record outcomes
        if: ${{ always() }}
        env:
          BUILD_OUTCOME: ${{ steps.signed.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          {
            printf 'Signed IPA: %s\n' "$BUILD_OUTCOME"
            printf 'App Store Connect upload: %s\n' "$UPLOAD_OUTCOME"
            printf '\nAn uploaded build still needs Apple processing and tester setup.\n'
            printf 'Signing does not validate physical-device behavior or App Review compliance.\n'
          } >> "$GITHUB_STEP_SUMMARY"
